<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Arrow Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#eceef2; touch-action:none;
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #viewport { position:fixed; inset:0; overflow:hidden; background:#eceef2; }
  #stage { position:absolute; left:50%; top:50%; width:720px; height:1280px; transform-origin:center center;
    overflow:hidden; background:radial-gradient(ellipse 130% 85% at 50% 8%, #ffffff 0%, #f5f6f9 55%, #e8eaef 100%); }

  /* ---------- progress ---------- */

  /* ---------- board ---------- */
  #board { position:absolute; z-index:10; background:#fff; border:3px solid #e4e7ee; border-radius:36px;
    box-shadow:0 18px 44px rgba(40,50,70,.13), inset 0 2px 0 rgba(255,255,255,.9); overflow:hidden; }
  #grid { position:absolute; inset:0; }
  #svg { position:absolute; inset:0; width:100%; height:100%; display:block; }

  .hit { fill:none; stroke:transparent; stroke-width:80; stroke-linecap:round;
    stroke-linejoin:round; cursor:pointer; pointer-events:stroke; }
  .ink { fill:none; stroke:#22262e; stroke-width:15; stroke-linecap:round; stroke-linejoin:round;
    pointer-events:none; transition:stroke .2s ease; }
  .piece.lit .ink { stroke:#2f7bff; }
  .piece.bad .ink { stroke:#e23b3b; }
  .piece { transition:transform .44s cubic-bezier(.4,0,.6,1), opacity .44s ease .1s; }
  .piece.shake { animation:shk .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shk {
    10%,90% { transform:translate(-7px,0) } 20%,80% { transform:translate(10px,0) }
    30%,50%,70% { transform:translate(-14px,0) } 40%,60% { transform:translate(14px,0) }
  }

  /* stylised tap cursor */
  #cursor { position:absolute; width:92px; height:92px; margin:-46px 0 0 -46px; z-index:26; pointer-events:none;
    display:none; transition:left .32s cubic-bezier(.3,1.1,.5,1), top .32s cubic-bezier(.3,1.1,.5,1); }
  #cursor .ring { position:absolute; inset:14px; border:5px solid rgba(34,38,46,.9); border-radius:50%;
    box-shadow:0 3px 10px rgba(40,50,70,.28); background:rgba(255,255,255,.35); }
  #cursor .dot { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    border-radius:50%; background:#22262e; }
  #cursor .pulse { position:absolute; inset:0; border:4px solid rgba(47,123,255,.55); border-radius:50%;
    animation:curPulse 1.5s ease-out infinite; }
  @keyframes curPulse { 0%{transform:scale(.55); opacity:.9} 100%{transform:scale(1.3); opacity:0} }
  #cursor.press .ring { animation:curPress .5s ease; }
  @keyframes curPress { 0%,100%{transform:scale(1)} 45%{transform:scale(.74)} }

  .ripple { position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%;
    border:4px solid rgba(47,123,255,.6); z-index:22; pointer-events:none;
    animation:rip .55s ease-out forwards; }
  @keyframes rip { 0%{transform:scale(.4); opacity:1} 100%{transform:scale(3); opacity:0} }


  /* ---------- brand ---------- */
  #top-bar { position:absolute; top:16px; left:0; width:100%; z-index:25;
    display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #top-logo { height:54px; width:auto; display:block; pointer-events:auto;
    filter:drop-shadow(0 5px 14px rgba(40,50,70,.28));
    animation:brandBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes brandBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.08) } }

  #cta-wrap { position:absolute; bottom:16px; left:0; width:100%; z-index:25;
    display:flex; justify-content:center; pointer-events:none; }
  #cta-pill { background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff; font-size:34px; font-weight:800;
    padding:16px 60px; border-radius:60px; box-shadow:0 7px 0 #6a29c2, 0 12px 26px rgba(40,50,70,.30);
    cursor:pointer; letter-spacing:.5px; white-space:nowrap; pointer-events:auto;
    animation:ctaBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes ctaBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.07) } }

  /* ---------- end card ---------- */
  #endcard { position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(30,36,48,.55); backdrop-filter:blur(4px); }
  #endcard.show { display:flex; }
  #endbox { width:664px; background:linear-gradient(180deg,#ffffff,#f2f4f8); border-radius:52px; padding:40px 44px 48px;
    text-align:center; box-shadow:0 22px 60px rgba(0,0,0,.45); animation:endIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes endIn { from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
  #endbox .cast { height:120px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  #endbox h1 { font-size:56px; color:#1e2128; font-weight:800; }
  #endbox p { font-size:34px; color:#78808f; font-weight:700; margin:12px 0 30px; }
  #end-cta { display:inline-block; background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff; font-size:50px;
    font-weight:800; padding:26px 92px; border-radius:70px; box-shadow:0 8px 0 #6a29c2, 0 12px 20px rgba(0,0,0,.25);
    cursor:pointer; animation:ctaBreathe2 1.3s ease-in-out infinite; }
  @keyframes ctaBreathe2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  #endbox .brand { margin-top:26px; font-size:30px; font-weight:700; color:#9aa2b2;
    display:flex; align-items:center; justify-content:center; gap:12px; }
  #endbox .brand img { height:40px; width:auto; display:block; }

  .confetti { position:absolute; width:16px; height:16px; z-index:35; border-radius:3px; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    #cta-pill, #end-cta, #top-logo, #cursor .pulse { animation:none !important; }
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <div id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <div id="cursor"><div class="pulse"></div><div class="ring"></div><div class="dot"></div></div>

    <div id="top-bar"><img id="top-logo" alt="Playgama"></div>
    <div id="cta-wrap"><div id="cta-pill">PLAY NOW</div></div>

    <div id="endcard">
      <div id="endbox">
        <div class="cast" id="end-cast"></div>
        <h1>Board cleared!</h1>
        <p>Arrow Puzzle</p>
        <div id="end-cta">PLAY NOW</div>
        <div class="brand">Play for free on <img id="brand-logo" alt="Playgama"></div>
      </div>
    </div>

  </div>
</div>

     head points; it is blocked when ANY of its cells has another piece on the
     ray ahead of it. Removing a piece only ever frees cells, so a greedy order
     exists - this board was verified solvable end to end. */
  var GRID = 7, U = 100;
  var DIRS = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0] };
  var START = [
    { c:6, r:0, d:"U", a:2, t:"L", b:1 },
    { c:1, r:3, d:"D", a:2, t:"R", b:1 },
    { c:6, r:5, d:"D", a:3, t:"L", b:1 },
    { c:0, r:5, d:"L", a:3, t:null, b:0 },
    { c:3, r:2, d:"D", a:2, t:"L", b:1 },
    { c:0, r:4, d:"D", a:3, t:null, b:0 },
    { c:2, r:6, d:"R", a:3, t:null, b:0 },
    { c:1, r:0, d:"L", a:2, t:null, b:0 },
    { c:3, r:4, d:"R", a:3, t:null, b:0 },
    { c:4, r:0, d:"L", a:2, t:null, b:0 },
    { c:4, r:3, d:"D", a:2, t:"R", b:1 },
    { c:3, r:3, d:"R", a:2, t:null, b:0 },
    { c:5, r:6, d:"D", a:3, t:"L", b:1 }
  ];

  function cellsOf(p) {
    var d = DIRS[p.d], out = [];
    for (var i = 0; i < p.a; i++) out.push({ c: p.c - d[0]*i, r: p.r - d[1]*i });
    if (p.t && p.b) {
      var td = DIRS[p.t], last = out[out.length - 1];
      for (var j = 1; j <= p.b; j++) out.push({ c: last.c + td[0]*j, r: last.r + td[1]*j });
    }
    return out;
  }

  var stage, boardEl, svg, cursor, ctaPill, endcard;
  var started = false, pieces = [], cleared = 0, busy = false;
  var idleTimer = null, hardTimer = null, hintTimer = null, litPiece = null;

  function occupiedBy(p, c, r) {
    for (var i = 0; i < p.cells.length; i++)
      if (p.cells[i].c === c && p.cells[i].r === r) return true;
    return false;
  }
  function blockerFor(p) {
    var d = DIRS[p.d];
    for (var i = 0; i < p.cells.length; i++) {
      var c = p.cells[i].c + d[0], r = p.cells[i].r + d[1];
      while (c >= 0 && c < GRID && r >= 0 && r < GRID) {
        for (var j = 0; j < pieces.length; j++) {
          var q = pieces[j];
          if (!q.gone && q !== p && occupiedBy(q, c, r)) return q;
        }
        c += d[0]; r += d[1];
      }
    }
    return null;
  }
  function isFree(p) { return blockerFor(p) === null; }

  /* ---- geometry: one shared SVG in board units, so the thin stroke never distorts ---- */
  function mid(cell) { return { x: cell.c * U + U/2, y: cell.r * U + U/2 }; }

  function pathFor(p) {
    var cs = p.cells, d = DIRS[p.d];
    var pts = cs.map(mid).reverse();               // tail first, head last
    var head = pts[pts.length - 1];
    // push the tip towards the edge of its cell so it reads as an arrow
    var tip = { x: head.x + d[0] * (U * 0.34), y: head.y + d[1] * (U * 0.34) };
    pts[pts.length - 1] = tip;
    var dd = "M" + pts[0].x + " " + pts[0].y;
    for (var i = 1; i < pts.length; i++) dd += " L" + pts[i].x + " " + pts[i].y;
    // chevron head
    var back = U * 0.30, side = U * 0.26;
    var bx = tip.x - d[0] * back, by = tip.y - d[1] * back;
    var px = -d[1], py = d[0];
    dd += " M" + (bx + px*side) + " " + (by + py*side) +
          " L" + tip.x + " " + tip.y +
          " L" + (bx - px*side) + " " + (by - py*side);
    return dd;
  }

  var NS = "http://www.w3.org/2000/svg";
  function buildBoard() {
    svg.setAttribute("viewBox", "0 0 " + (GRID*U) + " " + (GRID*U));
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var grid = document.createElementNS(NS, "g");
    for (var i = 1; i < GRID; i++) {
      ["h","v"].forEach(function (o) {
        var ln = document.createElementNS(NS, "line");
        ln.setAttribute(o === "h" ? "x1" : "y1", 0);
        ln.setAttribute(o === "h" ? "x2" : "y2", GRID*U);
        ln.setAttribute(o === "h" ? "y1" : "x1", i*U);
        ln.setAttribute(o === "h" ? "y2" : "x2", i*U);
        ln.setAttribute("stroke", "#eef0f4");
        ln.setAttribute("stroke-width", "4");
        grid.appendChild(ln);
      });
    }
    svg.appendChild(grid);

    pieces = START.map(function (src) {
      var p = { c:src.c, r:src.r, d:src.d, a:src.a, t:src.t, b:src.b, gone:false };
      p.cells = cellsOf(p);
      var g = document.createElementNS(NS, "g");
      g.setAttribute("class", "piece");
      var dd = pathFor(p);
      var hit = document.createElementNS(NS, "path");
      hit.setAttribute("class", "hit");
      hit.setAttribute("d", dd);
      var ink = document.createElementNS(NS, "path");
      ink.setAttribute("class", "ink");
      ink.setAttribute("d", dd);
      g.appendChild(ink); g.appendChild(hit);
      svg.appendChild(g);
      p.g = g;
      hit.addEventListener("pointerdown", function (ev) { onPiece(ev, p); });
      return p;
    });
    applyLayout();
  }

  function applyLayout() {
    if (!boardEl) return;
    var lay = L();
    boardEl.style.left = lay.board.x + "px";
    boardEl.style.top = lay.board.y + "px";
    boardEl.style.width = lay.board.size + "px";
    boardEl.style.height = lay.board.size + "px";
    var cw = document.getElementById("cta-wrap");
    if (cw) cw.style.bottom = lay.cta + "px";
    if (!ended) showHint();
  }

  /* ================= interaction ================= */
  function onPiece(ev, p) {
    ev.stopPropagation();
    if (ended) { openStore(); return; }
    if (busy || p.gone) return;
    firstTap();

    var lay = L(), k = lay.board.size / (GRID * U);
    var h = mid(p.cells[0]);
    ripple(lay.board.x + h.x * k, lay.board.y + h.y * k);

    var blocker = blockerFor(p);
    if (blocker) {
      sfxBlocked();
      p.g.classList.add("bad");
      p.g.classList.remove("shake"); void p.g.getBBox; p.g.classList.add("shake");
      blocker.g.classList.add("bad");
      setTimeout(function () {
        p.g.classList.remove("bad", "shake");
        blocker.g.classList.remove("bad");
      }, 460);
      return;
    }

    busy = true;
    stopHint();
    sfxFly();
    p.gone = true;
    p.g.classList.remove("lit");
    var d = DIRS[p.d], travel = (GRID + p.a + p.b + 1) * U;
    p.g.style.transform = "translate(" + (d[0]*travel) + "px," + (d[1]*travel) + "px)";
    p.g.style.opacity = "0";

    setTimeout(function () {
      if (p.g.parentNode) p.g.parentNode.removeChild(p.g);
      cleared++;
      busy = false;
      resetIdle();
      if (cleared >= pieces.length) {
        sfxWin(); confettiBurst();
        setTimeout(showEnd, 1300);
      } else {
        showHint();
      }
    }, 450);
  }

  function ripple(x, y) {
    var e = document.createElement("div");
    e.className = "ripple";
    e.style.left = x + "px"; e.style.top = y + "px";
    stage.appendChild(e);
    setTimeout(function(){ e.remove(); }, 560);
  }

  /* ---- hint: the pointed arrow turns blue, like the highlighted one in game ---- */
  function stopHint() {
    if (hintTimer) { clearInterval(hintTimer); hintTimer = null; }
    cursor.style.display = "none";
    if (litPiece && litPiece.g) litPiece.g.classList.remove("lit");
    litPiece = null;
  }
  function showHint() {
    stopHint();
    var target = null;
    for (var i = 0; i < pieces.length; i++) {
      if (!pieces[i].gone && isFree(pieces[i])) { target = pieces[i]; break; }
    }
    if (!target || ended) return;
    litPiece = target;
    target.g.classList.add("lit");
    var lay = L(), k = lay.board.size / (GRID * U), h = mid(target.cells[0]);
    cursor.style.display = "block";
    cursor.style.left = (lay.board.x + h.x * k) + "px";
    cursor.style.top  = (lay.board.y + h.y * k) + "px";
    function press() { cursor.classList.remove("press"); void cursor.offsetWidth; cursor.classList.add("press"); }
    press();
    hintTimer = setInterval(press, 1500);
  }

  function firstTap() {
    taps++;
    resetIdle();
    startMusic();
    wakeAudio();
    if (taps === 1) hardTimer = setTimeout(showEnd, HARD_TIMEOUT_MS);
  }
  function resetIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(showEnd, IDLE_TIMEOUT_MS);
  }

  function confettiBurst() {
    var colors = ["#2f7bff", "#22262e", "#ffb02e", "#9747ff", "#3ec48b"];
    for (var i = 0; i < 64; i++) {
      (function () {
        var p = document.createElement("div");
        p.className = "confetti";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = (STAGE_W/2 + (Math.random()-.5)*300) + "px";
        p.style.top = "-30px";
        stage.appendChild(p);
        var dur = 1400 + Math.random()*1200;
        p.animate([
          { transform: "rotate(0deg) translate(0,0)", opacity: 1 },
          { transform: "rotate(" + Math.random()*720 + "deg) translate(" +
            ((Math.random()-.5)*520) + "px," + (STAGE_H + 80) + "px)", opacity: .9 }
        ], { duration: dur, easing: "cubic-bezier(.2,.6,.6,1)" });
        setTimeout(function(){ p.remove(); }, dur);
      })();
    }
  }

  function showEnd() {
    if (ended) return;
    ended = true;
    if (idleTimer) clearTimeout(idleTimer);
    if (hardTimer) clearTimeout(hardTimer);
    stopHint(); stopMusic();
    document.getElementById("top-bar").style.display = "none";
    document.getElementById("cta-wrap").style.display = "none";
    endcard.classList.add("show");
  }

  function startGame() {
    if (started) return;
    started = true;
    fit();
    decodeMusic();
    buildBoard();
    showHint();
  }

  onDomReady(function () {
    stage   = document.getElementById("stage");
    boardEl = document.getElementById("board");
    svg     = document.getElementById("svg");
    cursor  = document.getElementById("cursor");
    ctaPill = document.getElementById("cta-pill");
    endcard = document.getElementById("endcard");

    document.getElementById("top-logo").src = A.logo_button;
    document.getElementById("brand-logo").src = A.logo_playgama;
    document.getElementById("end-cast").innerHTML =
      '<svg viewBox="0 0 300 100" width="300" height="100" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M20 50 H210 M180 24 L214 50 L180 76" fill="none" stroke="#22262e" ' +
      'stroke-width="15" stroke-linecap="round" stroke-linejoin="round"></path>' +
      '</svg>';

    stage.addEventListener("pointerdown", function () { if (ended) openStore(); });
    ctaPill.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    document.getElementById("end-cta").addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    endcard.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });

    fit();
    whenViewable(startGame);
  });
})();
</script>
</body>
</html>
