<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Piece of Cake: Merge &amp; Bake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#6b4630; touch-action:none;
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  img { -webkit-user-drag:none; pointer-events:none; }
  #viewport { position:fixed; inset:0; overflow:hidden; background:#6b4630; }
  #stage { position:absolute; left:50%; top:50%; width:720px; height:1280px; transform-origin:center center; overflow:hidden; }

  /* ---------- café room ---------- */
  #room { position:absolute; top:0; left:0; width:720px; height:600px; overflow:hidden;
    background:linear-gradient(180deg,#c98b5e 0%,#b5764a 60%,#a3663c 100%); }
  #room::after { content:""; position:absolute; left:0; right:0; bottom:0; height:90px; z-index:2;
    background:linear-gradient(180deg, rgba(120,66,38,0), rgba(120,66,38,.55)); }
  #brick { position:absolute; inset:0; opacity:.55;
    background:
      repeating-linear-gradient(0deg, transparent 0 42px, rgba(120,66,38,.9) 42px 47px),
      repeating-linear-gradient(90deg, transparent 0 96px, rgba(120,66,38,.75) 96px 101px); }
  #brick::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 96px, rgba(120,66,38,.75) 96px 101px);
    transform:translate(48px, 44px);
    mask:repeating-linear-gradient(0deg, transparent 0 47px, #000 47px 89px);
    -webkit-mask:repeating-linear-gradient(0deg, transparent 0 47px, #000 47px 89px); }
  #window { position:absolute; top:96px; left:34px; width:196px; height:250px;
    background:linear-gradient(180deg,#bfe6dc 0%,#8fcdb5 62%,#7ab89f 100%);
    border:14px solid #f2e6cd; border-radius:98px 98px 10px 10px;
    box-shadow:0 10px 20px rgba(60,30,10,.35), inset 0 0 26px rgba(255,255,255,.5); }
  #window::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:10px; background:#f2e6cd; transform:translateX(-50%); }
  #window::after { content:""; position:absolute; left:0; right:0; top:52%; height:10px; background:#f2e6cd; }
  /* ---------- top bar ---------- */
  #title-pill { position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:9;
    background:linear-gradient(180deg,#f7e6c8,#e8c491); border:5px solid #b5793c; border-radius:26px;
    padding:12px 34px; color:#8a5427; font-size:32px; font-weight:800;
    box-shadow:0 8px 16px rgba(40,20,8,.45); white-space:nowrap; }
  /* counter top + wooden floor continuing all the way down behind the board */
  #counter { position:absolute; top:540px; left:-20px; width:760px; height:760px; z-index:3;
    background:
      linear-gradient(180deg,
        #f2d4a0 0px, #e0b072 18px,
        #c9924f 96px,
        #b5793c 150px,
        #a86e33 420px,
        #96602c 760px);
    border-radius:26px 26px 0 0; box-shadow:0 -8px 22px rgba(60,30,10,.4); }
  #counter::before { content:""; position:absolute; top:150px; left:0; right:0; bottom:0;
    background:repeating-linear-gradient(90deg,
      transparent 0 116px, rgba(110,62,26,.42) 116px 121px);
    opacity:.75; }
  #counter::after { content:""; position:absolute; top:132px; left:0; right:0; height:26px;
    background:linear-gradient(180deg, rgba(90,48,18,.4), rgba(90,48,18,0)); }

  /* ---------- customers ---------- */
  #cust-slot { position:absolute; top:118px; left:16px; width:700px; height:450px; z-index:5; }
  .customer { position:absolute; left:18px; bottom:0; transition:transform .55s ease, opacity .55s ease; }
  .customer img { height:400px; filter:drop-shadow(0 10px 14px rgba(40,20,8,.45)); }
  .customer.enter { animation:custIn .65s cubic-bezier(.25,1.2,.4,1); }
  @keyframes custIn { from{transform:translateX(-320px); opacity:0} to{transform:translateX(0); opacity:1} }
  .customer.happy { animation:custHop .65s ease; }
  @keyframes custHop { 0%,100%{transform:translateY(0)} 38%{transform:translateY(-30px)} }
  .customer.leave { transform:translateX(420px); opacity:0; }

  .bubble { position:absolute; left:230px; top:18px; width:240px; height:244px; background:#fffaf0;
    border:7px solid #e0bd82; border-radius:34px 34px 34px 10px; z-index:6;
    box-shadow:0 10px 20px rgba(40,20,8,.4); animation:bubbleIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes bubbleIn { from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  .bubble .dish { position:absolute; inset:14px 14px 44px; display:flex; align-items:center; justify-content:center; }
  .bubble .dish img { max-width:180px; max-height:150px; filter:drop-shadow(0 5px 6px rgba(0,0,0,.28)); }
  .bubble .want { position:absolute; bottom:10px; left:0; width:100%; text-align:center; color:#a5793c;
    font-size:23px; font-weight:800; }
  .bubble .check { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:120px; }
  .bubble.done .check { display:flex; animation:checkPop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes checkPop { from{transform:scale(.3)} to{transform:scale(1)} }
  .bubble.done .dish, .bubble.done .want { opacity:.12; }

  #bg-folk { position:absolute; top:250px; right:14px; z-index:4; opacity:.92; }
  #bg-folk img { filter:drop-shadow(0 8px 10px rgba(40,20,8,.4)); }
  #bg-folk .mom { height:230px; }
  #bg-folk .kid { height:150px; margin-left:-46px; vertical-align:bottom; }

  /* ---------- merge board ---------- */
  #board { position:absolute; top:626px; left:34px; width:652px; height:566px; z-index:7;
    background:linear-gradient(160deg,#d9a35f,#b5793c 60%,#9a6330);
    border-radius:38px; border:9px solid #7d4f22; padding:18px;
    box-shadow:0 14px 26px rgba(30,14,4,.5), inset 0 8px 18px rgba(255,235,200,.3); }
  .cell { position:absolute; width:142px; height:124px; border-radius:22px;
    background:rgba(90,52,20,.3); box-shadow:inset 0 5px 10px rgba(0,0,0,.3), inset 0 -3px 0 rgba(255,220,170,.14); }
  .cell.hot { background:rgba(255,224,122,.4); box-shadow:inset 0 0 0 5px #ffe07a; }

  .item { position:absolute; width:142px; height:124px; z-index:10; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:left .28s cubic-bezier(.3,1.35,.5,1), top .28s cubic-bezier(.3,1.35,.5,1); }
  .item img { max-width:118px; max-height:104px; filter:drop-shadow(0 6px 7px rgba(0,0,0,.35)); }
  .item.dragging { transition:none; z-index:24; }
  .item.dragging img { transform:scale(1.12); filter:drop-shadow(0 12px 14px rgba(0,0,0,.45)); }
  .item.pop { animation:itemPop .5s cubic-bezier(.2,1.55,.4,1); }
  @keyframes itemPop { 0%{transform:scale(.35)} 68%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .item.sel img { filter:drop-shadow(0 0 14px rgba(255,235,140,1)) drop-shadow(0 6px 7px rgba(0,0,0,.35)); }
  .item.ready img { animation:readyGlow 1.15s ease-in-out infinite; }
  @keyframes readyGlow {
    0%,100% { filter:drop-shadow(0 0 8px rgba(255,235,140,.75)) drop-shadow(0 6px 7px rgba(0,0,0,.35)); transform:scale(1); }
    50% { filter:drop-shadow(0 0 26px rgba(255,222,90,1)) drop-shadow(0 6px 7px rgba(0,0,0,.35)); transform:scale(1.08); }
  }
  .item.gen { cursor:pointer; }
  .item.gen.tapped { animation:genShake .32s ease; }
  @keyframes genShake { 0%,100%{transform:scale(1) rotate(0)} 35%{transform:scale(.9) rotate(-5deg)} 70%{transform:scale(1.06) rotate(4deg)} }
  .item.gen .badge { position:absolute; right:10px; top:6px; min-width:38px; height:38px; border-radius:19px;
    background:linear-gradient(180deg,#8ee06a,#46a83a); border:4px solid #fff; color:#fff; font-size:22px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 6px rgba(0,0,0,.4); padding:0 6px; }
  .item.gen.pulseg img { animation:genPulse 1.2s ease-in-out infinite; }
  @keyframes genPulse {
    0%,100% { filter:drop-shadow(0 0 6px rgba(255,235,140,.6)) drop-shadow(0 6px 7px rgba(0,0,0,.35)); transform:scale(1); }
    50% { filter:drop-shadow(0 0 22px rgba(255,225,110,1)) drop-shadow(0 6px 7px rgba(0,0,0,.35)); transform:scale(1.07); }
  }

  .merge-ring { position:absolute; width:142px; height:124px; border-radius:50%; z-index:20; pointer-events:none;
    border:7px solid #ffe07a; animation:ringOut .55s ease-out forwards; }
  @keyframes ringOut { 0%{transform:scale(.35); opacity:1} 100%{transform:scale(1.6); opacity:0} }
  .spark { position:absolute; width:12px; height:12px; border-radius:50%; background:#ffe9a8; z-index:21; pointer-events:none; }

  /* chain preview */
  #chain { position:absolute; top:1204px; left:50%; transform:translateX(-50%); z-index:8;
    display:flex; align-items:center; gap:8px; background:rgba(60,32,12,.55); border:4px solid rgba(255,225,170,.4);
    border-radius:30px; padding:8px 18px; }
  #chain .ci { width:58px; height:52px; display:flex; align-items:center; justify-content:center; opacity:.45; }
  #chain .ci img { max-width:54px; max-height:48px; }
  #chain .ci.on { opacity:1; }
  #chain .ci.goal { opacity:1; animation:goalPulse 1.3s ease-in-out infinite; }
  @keyframes goalPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.13)} }
  #chain .arr { color:#ffdca8; font-size:24px; font-weight:800; }

  #hand { position:absolute; width:110px; height:110px; z-index:30; pointer-events:none; display:none; font-size:96px;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.5)); transform-origin:22% 12%;
    transition:left .3s ease, top .3s ease; }
  #hand.tapanim { animation:handTap 1.1s ease-in-out infinite; }
  @keyframes handTap { 0%,100%{transform:scale(1) rotate(-14deg)} 50%{transform:scale(.8) rotate(-5deg)} }

  #tut-text { position:absolute; top:576px; left:0; width:100%; text-align:center; font-size:32px; font-weight:800;
    color:#fff; text-shadow:0 3px 0 #7d4f22, 0 6px 12px rgba(0,0,0,.5); z-index:8; }

  .fly { position:absolute; z-index:26; pointer-events:none;
    transition:left .6s cubic-bezier(.35,-.12,.3,1.08), top .6s cubic-bezier(.35,-.12,.3,1.08), transform .6s; }
  .fly img { max-width:120px; max-height:106px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  .popup-coin { position:absolute; z-index:28; font-size:44px; font-weight:800; color:#ffe07a;
    text-shadow:0 3px 0 #7d4f22, 0 5px 10px rgba(0,0,0,.4); pointer-events:none; animation:popC .95s ease-out forwards; }
  @keyframes popC { 0%{transform:scale(.5) translateY(0); opacity:1} 100%{transform:scale(1.3) translateY(-95px); opacity:0} }

  #cta-pill { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:25;
    background:linear-gradient(180deg,#ff9a5e,#e85a2e); color:#fff; font-size:34px; font-weight:800;
    padding:16px 60px; border-radius:60px; box-shadow:0 7px 0 #ab4019, 0 12px 22px rgba(0,0,0,.45);
    display:none; animation:ctaBreathe 1.4s ease-in-out infinite; cursor:pointer; letter-spacing:.5px; }
  @keyframes ctaBreathe { 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.06)} }

  /* ---------- End card ---------- */
  #endcard { position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(50,26,10,.62); backdrop-filter:blur(3px); }
  #endcard.show { display:flex; }
  #endbox { width:580px; background:linear-gradient(180deg,#fffdf6,#fdeeda); border-radius:44px; padding:30px 36px 40px;
    text-align:center; box-shadow:0 22px 54px rgba(0,0,0,.5); animation:endIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes endIn { from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
  #endbox .cast { height:190px; display:flex; align-items:flex-end; justify-content:center; gap:2px; margin-bottom:6px; }
  #endbox .cast img { height:170px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.28)); }
  #endbox .cast img.small { height:120px; }
  #endbox h1 { font-size:46px; color:#e85a2e; font-weight:800; text-shadow:0 2px 0 #fff; }
  #endbox .coin-line { font-size:38px; font-weight:800; color:#e0a832; margin:8px 0 2px; }
  #endbox p { font-size:28px; color:#8a6c42; font-weight:700; margin:8px 0 24px; }
  #end-cta { display:inline-block; background:linear-gradient(180deg,#ff9a5e,#e85a2e); color:#fff; font-size:42px;
    font-weight:800; padding:22px 78px; border-radius:60px; box-shadow:0 8px 0 #ab4019, 0 12px 20px rgba(0,0,0,.28);
    cursor:pointer; animation:ctaBreathe2 1.3s ease-in-out infinite; }
  @keyframes ctaBreathe2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  #endbox .brand { margin-top:22px; font-size:24px; font-weight:700; color:#b59a72; }
  #endbox .brand b { color:#9a5fd6; }

  .confetti { position:absolute; width:16px; height:16px; z-index:35; border-radius:3px; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    #cta-pill, #end-cta, #hand, .item.ready img, .item.gen.pulseg img, #chain .ci.goal { animation:none !important; }
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <div id="room">
      <div id="brick"></div>
      <div id="window"></div>
    </div>
    <div id="counter"></div>

    <div id="title-pill">Grandpa's Caf&eacute;</div>

    <div id="bg-folk"><img class="mom" id="bgmom" alt=""><img class="kid" id="bgkid" alt=""></div>
    <div id="cust-slot"></div>

    <div id="board"></div>
    <div id="chain"></div>

    <div id="tut-text">Tap the box to get bread!</div>
    <div id="hand">&#128070;</div>
    <div id="cta-pill">PLAY NOW</div>

    <div id="endcard">
      <div id="endbox">
        <div class="cast">
          <img id="e1" alt=""><img id="e2" class="small" alt=""><img id="e3" alt=""><img id="e4" alt="">
        </div>
        <h1>Orders served!</h1>
        <p>Piece of Cake merge</p>
        <div id="end-cta">PLAY NOW</div>
        <div class="brand">Play free on <b>playgama.com</b> &mdash; no download</div>
      </div>
    </div>

  </div>
</div>

  /* ================= CONFIG ================= */
  var CLICK_URL = "https://playgama.com/game/piece-of-cake-merge--bake";
  var IDLE_TIMEOUT_MS = 25000;   // fires only if the player stops interacting
  var HARD_TIMEOUT_MS = 115000;  // total cap: enough to serve all four customers

  /* ================= MRAID bootstrap ================= */
  function whenViewable(cb) {
    if (typeof mraid === "undefined") { onDomReady(cb); return; }
    function start() {
      if (mraid.isViewable()) { cb(); }
      else {
        mraid.addEventListener("viewableChange", function h(v) {
          if (v) { mraid.removeEventListener("viewableChange", h); cb(); }
        });
      }
    }
    if (mraid.getState() === "loading") {
      mraid.addEventListener("ready", function r() {
        mraid.removeEventListener("ready", r); start();
      });
    } else { start(); }
  }
  function onDomReady(cb) {
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", cb);
    else cb();
  }
  function openStore() {
    try {
      if (typeof mraid !== "undefined" && mraid.open) { mraid.open(CLICK_URL); return; }
    } catch (e) {}
    window.location.href = CLICK_URL;
  }

  /* ================= Stage scaling ================= */
  var STAGE_W = 720, STAGE_H = 1280, curScale = 1;
  function fit() {
    var vw = (window.visualViewport && window.visualViewport.width)  || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    curScale = Math.min(vw / STAGE_W, vh / STAGE_H);
    document.getElementById("stage").style.transform =
      "translate(-50%, -50%) scale(" + curScale + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  [80, 250, 600, 1200].forEach(function (ms) { setTimeout(fit, ms); });

  /* ================= Audio (clips lifted from the game trailer) ================= */
  var AC = null, musicOn = false, musicSrc = null, musicGain = null;
  var musicBuf = null, sfxBufs = {}, taps = 0, ended = false;

  function audioCtx() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    return AC;
  }
  function b64ToBuf(dataUri) {
    var b64 = dataUri.split(",")[1];
    var bin = atob(b64);
    var len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function decodeAll() {
    var ctx = audioCtx();
    if (!ctx) return;
    function dec(uri, cb) {
      try {
        var p = ctx.decodeAudioData(b64ToBuf(uri), cb, function () {});
        if (p && p.then) p.then(cb, function () {});
      } catch (e) {}
    }
    dec(SND.music, function (b) { musicBuf = b; if (musicOn && !musicSrc) playMusic(); });
    ["merge", "serve", "pop"].forEach(function (k) {
      dec(SND[k], function (b) { sfxBufs[k] = b; });
    });
  }
  function playMusic() {
    var ctx = audioCtx();
    if (!ctx || !musicBuf || musicSrc) return;
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.34;
    musicGain.connect(ctx.destination);
    musicSrc = ctx.createBufferSource();
    musicSrc.buffer = musicBuf;
    musicSrc.loop = true;
    musicSrc.connect(musicGain);
    musicSrc.start(0);
  }
  function startMusic() {
    var ctx = audioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (musicOn) return;
    musicOn = true;
    playMusic();
  }
  function stopMusic() {
    musicOn = false;
    if (musicSrc) { try { musicSrc.stop(); } catch (e) {} try { musicSrc.disconnect(); } catch (e) {} musicSrc = null; }
    if (musicGain) { try { musicGain.disconnect(); } catch (e) {} musicGain = null; }
    if (AC && AC.state === "running") { try { AC.suspend(); } catch (e) {} }
  }
  function resumeMusicIfStarted() {
    if (taps > 0 && !ended) {
      if (AC && AC.state === "suspended") AC.resume();
      if (!musicOn) { musicOn = true; playMusic(); }
    }
  }
  function sfx(name, vol) {
    var ctx = audioCtx();
    if (!ctx || ctx.state !== "running" || !sfxBufs[name]) return;
    var g = ctx.createGain();
    g.gain.value = vol || 0.85;
    g.connect(ctx.destination);
    var s = ctx.createBufferSource();
    s.buffer = sfxBufs[name];
    s.connect(g);
    s.start(0);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopMusic(); else resumeMusicIfStarted();
  });
  if (typeof mraid !== "undefined") {
    try {
      mraid.addEventListener("viewableChange", function (v) {
        if (!v) stopMusic(); else resumeMusicIfStarted();
      });
    } catch (e) {}
  }

    glass_empty: "glass_water", glass_lemon: "jar_lemonade"                   // drinks
  };

  // recipe merges: every recipe here is on the path to an order.
  // No "bonus" recipes on purpose - bread+salami used to eat the salami the
  // club sandwich needs, which dead-ended granny's order.
  var RECIPE_LIST = [
    ["toast", "lettuce", "toast_lettuce"],           // bread + leaf
    ["toast_lettuce", "tomato", "toast_veggie"],     // + tomato
    ["toast_veggie", "toast", "sandwich_grill"],     // + top slice = grilled sandwich
    ["sandwich_grill", "salami", "club"],            // + salami = club sandwich
    ["glass_water", "lemon", "glass_lemon"]          // water + lemon = lemonade
  ];
  var RECIPES = {};
  RECIPE_LIST.forEach(function (r) { RECIPES[[r[0], r[1]].sort().join("|")] = r[2]; });
  function mergeResult(t1, t2) {
    if (t1 === t2) return CHAIN[t1] || null;
    return RECIPES[[t1, t2].sort().join("|")] || null;
  }

  var LABEL = {
    toast: "bread", toast_lettuce: "bread + leaf", toast_veggie: "open sandwich",
    sandwich_grill: "grilled sandwich", club: "club sandwich",
    salami_toast: "salami toast", egg_toast: "egg toast",
    batter: "batter", pancake: "pancake", pancake_stack: "pancake stack",
    glass_empty: "glass", glass_water: "water glass", glass_lemon: "lemonade glass", jar_lemonade: "lemonade jar",
    pot: "pot", pan: "pan", press: "grill press",
    lemon: "lemon", egg: "egg", salami: "salami", lettuce: "lettuce leaf", tomato: "tomato"
  };

  var ORDERS = [
    { cust: "builder", target: "sandwich_grill", reward: 5, line: "Grilled sandwich!",
      chain: ["toast", "toast_lettuce", "toast_veggie", "sandwich_grill"],
      gen: { art: "box_taped", product: "toast", n: 3 },
      seed: [["toast", 1], ["lettuce", 2], ["tomato", 5]],
      rescue: ["lettuce", "tomato"] },
    { cust: "kid", target: "pancake_stack", reward: 5, line: "Pancakes, please!",
      chain: ["batter", "pancake", "pancake_stack"],
      gen: { art: "box_small", product: "batter", n: 3 },
      seed: [["batter", 1], ["batter", 2], ["pancake", 5]],
      rescue: [] },
    { cust: "mom", target: "jar_lemonade", reward: 5, line: "Fresh lemonade!",
      chain: ["glass_empty", "glass_water", "glass_lemon", "jar_lemonade"],
      gen: { art: "box_open", product: "glass_empty", n: 3 },
      seed: [["glass_water", 1], ["lemon", 2], ["glass_lemon", 5]],
      rescue: ["lemon"] },
    { cust: "granny", target: "club", reward: 5, line: "A club sandwich, dear!",
      chain: ["toast_veggie", "sandwich_grill", "club"],
      gen: { art: "box_big", product: "toast", n: 3 },
      seed: [["toast_veggie", 1], ["salami", 2]],
      rescue: ["salami", "lettuce", "tomato"] }
  ];

  var COLS = 4, ROWS = 4, CELL_W = 150, CELL_H = 132, GAP = 5;
  var GEN_CELL = 0;

  /* ================= State ================= */
  var stage, board, chainBar, hand, ctaPill, endcard, tutText, titlePill, custSlot;
  var started = false, idleTimer = null, hardTimer = null;
  var coins = 0, orderIdx = 0;
  var cells = [], genEl = null, genLeft = 0, genCooldown = false, genProduct = "toast";
  var selected = null, curCustEl = null, curBubble = null;
  var BUBBLE_POS = { x: 330, y: 190 };

  function img(type, cls) {
    return '<img src="' + A[type] + '" alt="" ' + (cls ? 'class="' + cls + '"' : '') + '>';
  }
  function cellPos(i) {
    var c = i % COLS, r = Math.floor(i / COLS);
    return { x: 14 + c * (CELL_W + GAP), y: 14 + r * (CELL_H + GAP) };
  }
  function boardOrigin() { return { x: 34 + 9 + 18, y: 626 + 9 + 18 }; } // stage coords of board padding box

  function buildCells() {
    for (var i = 0; i < COLS * ROWS; i++) {
      var d = document.createElement("div");
      d.className = "cell";
      var p = cellPos(i);
      d.style.left = p.x + "px";
      d.style.top = p.y + "px";
      d.dataset.idx = i;
      board.appendChild(d);
      cells.push(null);
    }
  }
  function cellEls() { return board.querySelectorAll(".cell"); }

  function firstFree() {
    for (var i = 0; i < cells.length; i++) if (i !== GEN_CELL && !cells[i]) return i;
    return -1;
  }

  function addItem(type, idx, pop) {
    var el = document.createElement("div");
    el.className = "item" + (pop ? " pop" : "");
    el.dataset.type = type;
    el.dataset.cell = idx;
    el.innerHTML = img(type);
    var p = cellPos(idx);
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    board.appendChild(el);
    cells[idx] = el;
    attachItem(el);
    return el;
  }

  function makeGenerator(art) {
    genEl = document.createElement("div");
    genEl.className = "item gen pulseg";
    genEl.dataset.type = art;
    genEl.dataset.cell = GEN_CELL;
    genEl.innerHTML = img(art) + '<div class="badge" id="gen-badge">' + genLeft + '</div>';
    var p = cellPos(GEN_CELL);
    genEl.style.left = p.x + "px";
    genEl.style.top = p.y + "px";
    board.appendChild(genEl);
    cells[GEN_CELL] = genEl;
    genEl.addEventListener("pointerdown", function (ev) {
      ev.stopPropagation();
      onGeneratorTap();
    });
  }

  function onGeneratorTap() {
    if (ended) { openStore(); return; }
    firstTap();
    if (genCooldown || genLeft <= 0) return;
    var free = firstFree();
    if (free < 0) { setTut("Board is full &mdash; merge something!"); return; }
    genCooldown = true;
    setTimeout(function(){ genCooldown = false; }, 260);
    genLeft--;
    document.getElementById("gen-badge").textContent = genLeft;
    genEl.classList.remove("tapped"); void genEl.offsetWidth; genEl.classList.add("tapped");
    if (genLeft <= 0) genEl.classList.remove("pulseg");
    sfx("pop", 0.7);
    // bread pops out of the box into the free cell
    var gp = cellPos(GEN_CELL), fp = cellPos(free);
    var f = document.createElement("div");
    f.className = "item";
    f.style.transition = "left .34s cubic-bezier(.3,1.3,.5,1), top .34s cubic-bezier(.3,1.3,.5,1)";
    f.innerHTML = img(genProduct);
    f.style.left = gp.x + "px"; f.style.top = gp.y + "px";
    board.appendChild(f);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.left = fp.x + "px"; f.style.top = fp.y + "px";
      });
    });
    setTimeout(function () {
      f.remove();
      addItem(genProduct, free, true);
      updateChainBar();
      guide();
    }, 350);
  }

  function clearBoard() {
    cells.forEach(function (el) { if (el) el.remove(); });
    for (var i = 0; i < cells.length; i++) cells[i] = null;
    selected = null; genEl = null;
  }

  function sparkle(idx) {
    var p = cellPos(idx), o = boardOrigin();
    for (var i = 0; i < 10; i++) {
      (function (k) {
        var s = document.createElement("div");
        s.className = "spark";
        s.style.left = (o.x + p.x + CELL_W / 2 - 6) + "px";
        s.style.top = (o.y + p.y + CELL_H / 2 - 6) + "px";
        stage.appendChild(s);
        var ang = (k / 10) * Math.PI * 2, dist = 70 + Math.random() * 46;
        s.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) scale(0)", opacity: 0 }
        ], { duration: 520, easing: "cubic-bezier(.2,.7,.4,1)" });
        setTimeout(function(){ s.remove(); }, 540);
      })(i);
    }
    var r = document.createElement("div");
    r.className = "merge-ring";
    r.style.left = p.x + "px"; r.style.top = p.y + "px";
    board.appendChild(r);
    setTimeout(function(){ r.remove(); }, 570);
  }

  function mergeItems(a, b) {
    var next = mergeResult(a.dataset.type, b.dataset.type);
    if (!next) return;
    var isRecipe = a.dataset.type !== b.dataset.type;
    var bCell = parseInt(b.dataset.cell, 10);
    cells[parseInt(a.dataset.cell, 10)] = null;
    cells[bCell] = null;
    a.remove(); b.remove();
    var merged = addItem(next, bCell, true);
    sparkle(bCell);
    var isGoal = next === ORDERS[orderIdx].target;
    sfx(isGoal ? "serve" : "merge", isGoal ? 0.95 : 0.85);
    selected = null;
    updateChainBar();
    if (isGoal) {
      merged.classList.add("ready");
      setTut("Serve it &mdash; tap the " + LABEL[next] + "!");
      pointAt(parseInt(merged.dataset.cell, 10));
    } else {
      guide();
    }
  }

  function pairOnBoard() {
    var list = [];
    for (var i = 0; i < cells.length; i++) {
      if (cells[i] && cells[i] !== genEl) list.push(cells[i]);
    }
    var target = ORDERS[orderIdx].target;
    var chain = ORDERS[orderIdx].chain;
    var best = null, bestScore = -1;
    for (var i2 = 0; i2 < list.length; i2++) {
      for (var j2 = i2 + 1; j2 < list.length; j2++) {
        var t1 = list[i2].dataset.type, t2 = list[j2].dataset.type;
        var res = mergeResult(t1, t2);
        if (!res) continue;
        // score: finishing the order beats progressing the order's chain,
        // which beats any other legal merge (those can dead-end)
        var score = (res === target) ? 3 : (chain.indexOf(res) >= 0 ? 2 : 1);
        var recipe = t1 !== t2;
        if (score > bestScore) {
          bestScore = score;
          best = [list[i2], list[j2], recipe];
        }
      }
    }
    return best;
  }

  function pointAt(idx) {
    var p = cellPos(idx), o = boardOrigin();
    hand.style.display = "block";
    hand.className = ""; hand.id = "hand";
    hand.classList.add("tapanim");
    hand.style.left = (o.x + p.x + 52) + "px";
    hand.style.top = (o.y + p.y + 46) + "px";
  }

  function guide() {
    var pair = pairOnBoard();
    if (pair) {
      if (pair[2]) {
        setTut("Combine " + LABEL[pair[0].dataset.type] + " + " + LABEL[pair[1].dataset.type] + "!");
      } else {
        setTut("Drag one " + LABEL[pair[0].dataset.type] + " onto the other!");
      }
      pointAt(parseInt(pair[0].dataset.cell, 10));
    } else if (genLeft > 0) {
      setTut("Tap the box for more " + LABEL[genProduct] + "!");
      pointAt(GEN_CELL);
    } else {
      // stuck: no legal pair and an empty box. Drop in the ingredient the
      // order is missing rather than piling up more of the same item.
      var o = ORDERS[orderIdx];
      var onBoard = {}, hasTarget = false;
      for (var k = 0; k < cells.length; k++) {
        if (!cells[k] || cells[k] === genEl) continue;
        onBoard[cells[k].dataset.type] = true;
        if (cells[k].dataset.type === o.target) hasTarget = true;
      }
      if (hasTarget) { hand.style.display = "none"; setTut(""); return; }
      var rescue = (o.rescue || []).filter(function (t) { return !onBoard[t]; });
      var free = firstFree();
      if (rescue.length && free >= 0) {
        addItem(rescue[0], free, true);
        sfx("pop", 0.7);
        updateChainBar();
        guide();
      } else {
        genLeft = 2;
        var badge = document.getElementById("gen-badge");
        if (badge) badge.textContent = genLeft;
        if (genEl) genEl.classList.add("pulseg");
        setTut("Tap the box for more " + LABEL[genProduct] + "!");
        pointAt(GEN_CELL);
      }
    }
  }

  function setTut(m) { tutText.innerHTML = m; }

  /* ================= Drag & tap ================= */
  var drag = null;
  function attachItem(el) {
    el.addEventListener("pointerdown", function (ev) {
      if (ended) { openStore(); return; }
      ev.stopPropagation();
      firstTap();
      if (el.classList.contains("ready")) { serve(el); return; }
      drag = {
        el: el, sx: ev.clientX, sy: ev.clientY,
        ol: parseFloat(el.style.left), ot: parseFloat(el.style.top), moved: false
      };
      el.classList.add("dragging");
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    el.addEventListener("pointermove", function (ev) {
      if (!drag || drag.el !== el) return;
      var dx = (ev.clientX - drag.sx) / curScale;
      var dy = (ev.clientY - drag.sy) / curScale;
      if (Math.abs(dx) + Math.abs(dy) > 7) drag.moved = true;
      el.style.left = (drag.ol + dx) + "px";
      el.style.top  = (drag.ot + dy) + "px";
      highlightDrop(el);
    });
    function finish(ev) {
      if (!drag || drag.el !== el) return;
      el.classList.remove("dragging");
      var d = drag; drag = null;
      clearHot();
      if (d.moved) {
        var t = dropTarget(el);
        if (t.item && mergeResult(el.dataset.type, t.item.dataset.type)) {
          mergeItems(el, t.item);
          return;
        }
        if (t.idx >= 0 && !cells[t.idx] && t.idx !== GEN_CELL) {
          // move into an empty cell
          cells[parseInt(el.dataset.cell, 10)] = null;
          cells[t.idx] = el;
          el.dataset.cell = t.idx;
          var np = cellPos(t.idx);
          el.style.left = np.x + "px"; el.style.top = np.y + "px";
          return;
        }
        el.style.left = d.ol + "px"; el.style.top = d.ot + "px";
      } else {
        if (selected && selected !== el && mergeResult(selected.dataset.type, el.dataset.type)) {
          selected.classList.remove("sel");
          mergeItems(selected, el);
        } else {
          if (selected) selected.classList.remove("sel");
          selected = el; el.classList.add("sel");
        }
      }
    }
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  function dropTarget(el) {
    var cx = parseFloat(el.style.left) + CELL_W / 2;
    var cy = parseFloat(el.style.top) + CELL_H / 2;
    for (var i = 0; i < cells.length; i++) {
      var p = cellPos(i);
      if (cx > p.x && cx < p.x + CELL_W && cy > p.y && cy < p.y + CELL_H)
        return { idx: i, item: cells[i] === el ? null : cells[i] };
    }
    return { idx: -1, item: null };
  }
  function clearHot() {
    var cs = cellEls();
    for (var i = 0; i < cs.length; i++) cs[i].classList.remove("hot");
  }
  function highlightDrop(el) {
    clearHot();
    var t = dropTarget(el);
    if (t.item && mergeResult(el.dataset.type, t.item.dataset.type)) {
      cellEls()[t.idx].classList.add("hot");
    }
  }

  function firstTap() {
    taps++;
    resetIdle();
    startMusic();
    if (taps === 1) {
      hardTimer = setTimeout(showEnd, HARD_TIMEOUT_MS);
      if (titlePill) titlePill.style.display = "none";
      ctaPill.style.display = "block";
    }
  }

  /* ================= Chain bar ================= */
  function buildChainBar(chain) {
    var h = "";
    chain.forEach(function (t, i) {
      h += '<div class="ci" data-t="' + t + '">' + img(t) + '</div>';
      if (i < chain.length - 1) h += '<div class="arr">&#8250;</div>';
    });
    chainBar.innerHTML = h;
  }
  function updateChainBar() {
    var have = {};
    cells.forEach(function (el) { if (el && el !== genEl) have[el.dataset.type] = 1; });
    var goal = ORDERS[orderIdx].target;
    chainBar.querySelectorAll(".ci").forEach(function (ci) {
      var t = ci.dataset.t;
      ci.classList.toggle("on", !!have[t]);
      ci.classList.toggle("goal", t === goal);
    });
  }

  /* ================= Orders ================= */
  function spawnCustomer(idx) {
    var o = ORDERS[idx];
    custSlot.innerHTML = "";
    curCustEl = document.createElement("div");
    curCustEl.className = "customer enter";
    curCustEl.innerHTML = img(o.cust);
    custSlot.appendChild(curCustEl);
    curBubble = document.createElement("div");
    curBubble.className = "bubble";
    curBubble.innerHTML = '<div class="dish">' + img(o.target) + '</div>' +
      '<div class="want">' + o.line + '</div><div class="check">&#9989;</div>';
    custSlot.appendChild(curBubble);

    clearBoard();
    genLeft = o.gen.n;
    genProduct = o.gen.product;
    makeGenerator(o.gen.art);
    o.seed.forEach(function (s) { addItem(s[0], s[1]); });
    buildChainBar(o.chain);
    updateChainBar();
    guide();
  }

  function serve(el) {
    var o = ORDERS[orderIdx];
    hand.style.display = "none";
    setTut("");
    el.classList.remove("ready");
    var idx = parseInt(el.dataset.cell, 10);
    cells[idx] = null;
    var p = cellPos(idx), or_ = boardOrigin();
    var f = document.createElement("div");
    f.className = "fly";
    f.innerHTML = img(o.target);
    f.style.left = (or_.x + p.x) + "px";
    f.style.top = (or_.y + p.y) + "px";
    stage.appendChild(f);
    el.remove();
    updateChainBar();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.left = BUBBLE_POS.x + "px";
        f.style.top = BUBBLE_POS.y + "px";
        f.style.transform = "scale(1.15)";
      });
    });
    sfx("merge", 0.8);
    setTimeout(function () {
      f.remove();
      curBubble.classList.add("done");
      curCustEl.classList.remove("enter");
      curCustEl.classList.add("happy");
      coins += o.reward;
      if (orderIdx === ORDERS.length - 1) coins = 20;
      var pop = document.createElement("div");
      pop.className = "popup-coin";
      pop.textContent = "+" + o.reward + " \uD83E\uDE99";
      pop.style.left = (BUBBLE_POS.x + 40) + "px";
      pop.style.top = (BUBBLE_POS.y + 120) + "px";
      stage.appendChild(pop);
      setTimeout(function(){ pop.remove(); }, 960);
      sfx("serve", 1.0);
      setTimeout(function () {
        curCustEl.classList.add("leave");
        curBubble.style.opacity = "0";
      }, 850);
      setTimeout(function () {
        orderIdx++;
        if (orderIdx >= ORDERS.length) {
          confettiBurst();
          setTimeout(showEnd, 1300);
        } else {
          spawnCustomer(orderIdx);
        }
      }, 1450);
    }, 620);
  }

  function resetIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(showEnd, IDLE_TIMEOUT_MS);
  }

  function confettiBurst() {
    var colors = ["#ffe07a", "#f2a3c4", "#a4d43e", "#6b9fd6", "#e8653a", "#fff"];
    for (var i = 0; i < 64; i++) {
      (function () {
        var p = document.createElement("div");
        p.className = "confetti";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = (360 + (Math.random() - .5) * 280) + "px";
        p.style.top = "-30px";
        stage.appendChild(p);
        var dur = 1400 + Math.random() * 1200;
        p.animate([
          { transform: "rotate(0deg) translate(0,0)", opacity: 1 },
          { transform: "rotate(" + Math.random() * 720 + "deg) translate(" + ((Math.random() - .5) * 520) + "px,1360px)", opacity: .9 }
        ], { duration: dur, easing: "cubic-bezier(.2,.6,.6,1)" });
        setTimeout(function(){ p.remove(); }, dur);
      })();
    }
  }

  function showEnd() {
    if (ended) return;
    ended = true;
    if (idleTimer) clearTimeout(idleTimer);
    if (hardTimer) clearTimeout(hardTimer);
    hand.style.display = "none";
    ctaPill.style.display = "none";
    stopMusic();
    endcard.classList.add("show");
  }

  function startGame() {
    if (started) return;
    started = true;
    fit();
    decodeAll();
    spawnCustomer(0);
    // Per AppLovin spec, ad timers start only after the first user interaction
  }

  onDomReady(function () {
    stage    = document.getElementById("stage");
    board    = document.getElementById("board");
    chainBar = document.getElementById("chain");
    hand     = document.getElementById("hand");
    ctaPill  = document.getElementById("cta-pill");
    endcard  = document.getElementById("endcard");
    tutText  = document.getElementById("tut-text");
    titlePill = document.getElementById("title-pill");
    custSlot = document.getElementById("cust-slot");

    // static art
    document.getElementById("bgmom").src = A.mom;
    document.getElementById("bgkid").src = A.kid;
    document.getElementById("e1").src = A.mom;
    document.getElementById("e2").src = A.kid;
    document.getElementById("e3").src = A.builder;
    document.getElementById("e4").src = A.granny;

    buildCells();

    stage.addEventListener("pointerdown", function () { if (ended) openStore(); });
    ctaPill.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    document.getElementById("end-cta").addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    endcard.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });

    fit();
    whenViewable(startGame);
  });
})();
</script>
