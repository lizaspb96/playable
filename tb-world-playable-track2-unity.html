<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TB World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#c98a5e; touch-action:none;
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  img { -webkit-user-drag:none; pointer-events:none; }
  #viewport { position:fixed; inset:0; overflow:hidden; background:#c98a5e; }
  #stage { position:absolute; left:50%; top:50%; width:720px; height:1280px; transform-origin:center center;
    overflow:hidden; background:#eeaa77; }

  /* ---------- room ---------- */
  #room { position:absolute; top:0; left:0; width:720px; height:1012px; overflow:hidden; z-index:1; }
  #room .bg { position:absolute; top:0; left:0; width:720px; display:block; }
  #floor { position:absolute; top:612px; left:0; width:720px; height:400px;
    background:linear-gradient(180deg,#eeaa77 0%,#e69c66 55%,#d98d57 100%); }
  #floor::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, transparent 0 46px, rgba(150,90,50,.16) 46px 50px); }

  .slot { position:absolute; z-index:3; border:5px dashed rgba(255,255,255,.85); border-radius:22px;
    background:rgba(255,255,255,.16); transition:opacity .3s, transform .3s;
    animation:slotPulse 1.5s ease-in-out infinite; }
  @keyframes slotPulse { 0%,100%{opacity:.75} 50%{opacity:1} }
  .slot.hot { border-color:#ffe14d; background:rgba(255,225,77,.32); transform:scale(1.05); }
  .slot.done { opacity:0; pointer-events:none; animation:none; }

  .placed { position:absolute; z-index:5; pointer-events:none; }
  .placed img { display:block; width:100%; filter:drop-shadow(0 6px 8px rgba(60,35,20,.35)); }
  .placed.pop { animation:placePop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes placePop { 0%{transform:scale(.5)} 65%{transform:scale(1.14)} 100%{transform:scale(1)} }

  #kid { position:absolute; z-index:6; width:150px; pointer-events:none; }
  #kid img { display:block; width:100%; filter:drop-shadow(0 6px 8px rgba(60,35,20,.4)); }
  #kid.happy { animation:kidHop .6s ease; }
  #kid2 { position:absolute; z-index:4; width:120px; pointer-events:none; }
  #kid2 img { display:block; width:100%; filter:drop-shadow(0 6px 8px rgba(60,35,20,.35)); }
  #kid2.happy { animation:kidHop .6s ease .12s; }
  @keyframes kidHop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-32px)} }

  /* ---------- tray ---------- */
  #tray { position:absolute; top:1028px; left:24px; width:672px; height:118px; z-index:12;
    background:rgba(255,252,245,.9); border:6px solid #fff; border-radius:32px;
    box-shadow:0 8px 16px rgba(60,35,20,.3); display:flex; align-items:center; justify-content:space-around; }
  .tray-item { width:132px; height:96px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:none; transition:transform .2s, opacity .3s; }
  .tray-item img { max-width:118px; max-height:90px; display:block;
    filter:drop-shadow(0 3px 5px rgba(60,35,20,.3)); }
  .tray-item.hint img { animation:hintPulse 1.2s ease-in-out infinite; }
  @keyframes hintPulse {
    0%,100% { filter:drop-shadow(0 0 6px rgba(255,225,77,.7)) drop-shadow(0 3px 5px rgba(60,35,20,.3)); transform:scale(1); }
    50% { filter:drop-shadow(0 0 20px rgba(255,225,77,1)) drop-shadow(0 3px 5px rgba(60,35,20,.3)); transform:scale(1.08); }
  }
  .tray-item.gone { opacity:0; transform:scale(.5); pointer-events:none; }
  .drag-ghost { position:absolute; z-index:28; pointer-events:none; }
  .drag-ghost img { display:block; width:100%; filter:drop-shadow(0 10px 14px rgba(60,35,20,.45)); }

  .spark { position:absolute; width:14px; height:14px; border-radius:50%; background:#ffe9a8; z-index:20; pointer-events:none; }

  /* ---------- top logo / bottom CTA ---------- */
  #top-bar { position:absolute; top:16px; left:0; width:100%; z-index:25;
    display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #top-logo { height:54px; width:auto; display:block; pointer-events:auto;
    filter:drop-shadow(0 5px 12px rgba(40,25,12,.5));
    animation:brandBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes brandBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.08) } }

  #cta-wrap { position:absolute; bottom:16px; left:0; width:100%; z-index:25;
    display:flex; justify-content:center; pointer-events:none; }
  #cta-pill { background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff; font-size:34px; font-weight:800;
    padding:16px 60px; border-radius:60px; box-shadow:0 7px 0 #6a29c2, 0 12px 22px rgba(0,0,0,.3);
    cursor:pointer; letter-spacing:.5px; white-space:nowrap; pointer-events:auto;
    animation:ctaBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes ctaBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.07) } }

  #hand { position:absolute; width:110px; height:110px; z-index:30; pointer-events:none; display:none;
    font-size:96px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)); transform-origin:22% 12%; }
  #hand.tapanim { animation:handTap 1.1s ease-in-out infinite; }
  @keyframes handTap { 0%,100%{transform:scale(1) rotate(-14deg)} 50%{transform:scale(.8) rotate(-5deg)} }

  /* ---------- End card ---------- */
  #endcard { position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(50,32,18,.58); backdrop-filter:blur(3px); }
  #endcard.show { display:flex; }
  #endbox { width:664px; background:linear-gradient(180deg,#fffdf8,#f5ecff); border-radius:52px; padding:36px 44px 48px;
    text-align:center; box-shadow:0 22px 54px rgba(0,0,0,.45); animation:endIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes endIn { from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
  #endbox .cast { height:210px; display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-bottom:8px; }
  #endbox .cast img { filter:drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  #endbox .cast img.tall { height:200px; }
  #endbox .cast img.small { height:112px; }
  #endbox h1 { font-size:56px; color:#9747ff; font-weight:800; text-shadow:0 2px 0 #fff; }
  #endbox p { font-size:34px; color:#7c6a8a; font-weight:700; margin:12px 0 30px; }
  #end-cta { display:inline-block; background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff; font-size:50px;
    font-weight:800; padding:26px 92px; border-radius:70px; box-shadow:0 8px 0 #6a29c2, 0 12px 20px rgba(0,0,0,.25);
    cursor:pointer; animation:ctaBreathe2 1.3s ease-in-out infinite; }
  @keyframes ctaBreathe2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  #endbox .brand { margin-top:26px; font-size:30px; font-weight:700; color:#a294b5;
    display:flex; align-items:center; justify-content:center; gap:12px; }
  #endbox .brand img { height:40px; width:auto; display:block; }

  .confetti { position:absolute; width:16px; height:16px; z-index:35; border-radius:3px; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    #cta-pill, #end-cta, #hand, #top-logo, .slot, .tray-item.hint img { animation:none !important; }
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <div id="room">
      <img class="bg" id="room-bg" alt="">
      <div id="floor"></div>
      <div id="kid"><img id="kid-img" alt=""></div>
      <div id="kid2"><img id="kid2-img" alt=""></div>
    </div>

    <div id="tray"></div>

    <div id="top-bar"><img id="top-logo" alt="Playgama"></div>
    <div id="cta-wrap"><div id="cta-pill">PLAY NOW</div></div>
    <div id="hand">&#128070;</div>

    <div id="endcard">
      <div id="endbox">
        <div class="cast">
          <img id="e1" class="tall" alt=""><img id="e2" class="small" alt=""><img id="e3" class="tall" alt=""><img id="e4" class="small" alt="">
        </div>
        <h1>Room ready!</h1>
        <p>TB World</p>
        <div id="end-cta">PLAY NOW</div>
        <div class="brand">Play for free on <img id="brand-logo" alt="Playgama"></div>
      </div>
    </div>

  </div>
</div>

  }
  function stopMusic() {
    musicOn = false;
    if (musicSrc) { try { musicSrc.stop(); } catch (e) {} try { musicSrc.disconnect(); } catch (e) {} musicSrc = null; }
    if (musicGain) { try { musicGain.disconnect(); } catch (e) {} musicGain = null; }
    if (AC && AC.state === "running") { try { AC.suspend(); } catch (e) {} }
  }
  function resumeMusicIfStarted() {
    if (taps > 0 && !ended) {
      if (AC && AC.state === "suspended") AC.resume();
      if (!musicOn) { musicOn = true; playMusic(); }
    }
  }
  function sfx(name, vol, rate) {
    var ctx = audioCtx();
    if (!ctx || ctx.state !== "running" || !sfxBufs[name]) return;
    var g = ctx.createGain();
    g.gain.value = vol || 0.85;
    g.connect(ctx.destination);
    var sN = ctx.createBufferSource();
    sN.buffer = sfxBufs[name];
    if (rate) sN.playbackRate.value = rate;
    sN.connect(g);
    sN.start(0);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopMusic(); else resumeMusicIfStarted();
  });
  if (typeof mraid !== "undefined") {
    try {
      mraid.addEventListener("viewableChange", function (v) {
        if (!v) stopMusic(); else resumeMusicIfStarted();
      });
    } catch (e) {}
  }

  /* ================= Furniture layout =================
     x,y = centre of the slot on the floor, w = display width.
     Items further back sit higher up and are drawn smaller. */
  var ITEMS = [
    { key:"fridge", x:96,  y:600, w:118 },                 // left, against the wall
    { key:"sofa",   x:566, y:646, w:248 },                 // right, under the window
    { key:"chair",  x:296, y:812, w:186 },                 // armchair towards the centre
    { key:"cat",    x:300, y:728, w:92,  onTop:"chair" },  // the cat sits on the armchair
    { key:"dog",    x:150, y:944, w:108 }                  // dog on the floor in front
  ];
  var KID  = { x:506, y:904, w:140 };   // both kids fill the right-centre
  var KID2 = { x:648, y:832, w:118 };

  /* ================= State ================= */
  var stage, room, tray, kid, hand, ctaPill, endcard;
  var started = false, ended = false, taps = 0, placedCount = 0;
  var idleTimer = null, hardTimer = null, hintTimer = null;
  var slots = {}, trayItems = {}, drag = null;

  function el(tag, cls, parent) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    (parent || stage).appendChild(d);
    return d;
  }

  // one rule for everything standing on the floor: the lower the base line,
  // the closer to the viewer, so nothing can cover a character standing in front
  function depth(y) { return Math.round(y / 10) + 5; }

  function buildRoom() {
    ITEMS.forEach(function (it) {
      var im = new Image();
      im.src = A["v2_" + it.key];
      it.img = im;
      var s = el("div", "slot", room);
      var h = 86;                                  // slot plate height on the floor
      s.style.width = it.w + "px";
      s.style.height = h + "px";
      s.style.left = (it.x - it.w / 2) + "px";
      s.style.top = (it.y - h) + "px";
      slots[it.key] = s;
    });
    kid.style.width = KID.w + "px";
    kid.style.left = (KID.x - KID.w / 2) + "px";
    kid.style.zIndex = depth(KID.y);
    document.getElementById("kid-img").src = A.v2_kid1;
    var k2 = document.getElementById("kid2"), k2i = document.getElementById("kid2-img");
    k2.style.width = KID2.w + "px";
    k2.style.left = (KID2.x - KID2.w / 2) + "px";
    k2.style.zIndex = depth(KID2.y);
    k2i.src = A.v2_kid3;
    k2i.onload = function () { k2.style.top = (KID2.y - k2.offsetHeight) + "px"; };
    // bottom-anchor the kid once its sprite is measured
    var ki = document.getElementById("kid-img");
    ki.onload = function () {
      kid.style.top = (KID.y - kid.offsetHeight) + "px";
    };
  }

  function buildTray() {
    ITEMS.forEach(function (it) {
      var t = el("div", "tray-item", tray);
      t.dataset.key = it.key;
      t.innerHTML = '<img src="' + A["v2_" + it.key] + '" alt="">';
      trayItems[it.key] = t;
      t.addEventListener("pointerdown", onGrab);
    });
  }

  /* ================= Drag & drop ================= */
  function onGrab(ev) {
    if (ended) { openStore(); return; }
    ev.preventDefault();
    ev.stopPropagation();
    firstTap();
    var t = ev.currentTarget;
    if (t.classList.contains("gone")) return;
    startMusic();
    sfx("pick", 0.75);
    var key = t.dataset.key;
    var it = itemByKey(key);
    stopHint();

    var g = el("div", "drag-ghost", stage);
    g.style.width = it.w + "px";
    g.innerHTML = '<img src="' + A["v2_" + key] + '" alt="">';
    var p = pointerInStage(ev);
    g.style.left = (p.x - it.w / 2) + "px";
    g.style.top  = (p.y - 60) + "px";
    drag = { key:key, ghost:g, item:it, trayEl:t };
    t.classList.add("gone");
    slots[key].classList.add("hot");
    try { t.setPointerCapture(ev.pointerId); } catch (e) {}
  }

  function pointerInStage(ev) {
    var r = stage.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / curScale, y: (ev.clientY - r.top) / curScale };
  }

  function onMove(ev) {
    if (!drag) return;
    var p = pointerInStage(ev);
    drag.ghost.style.left = (p.x - drag.item.w / 2) + "px";
    drag.ghost.style.top  = (p.y - 60) + "px";
  }

  function onRelease(ev) {
    if (!drag) return;
    var d = drag; drag = null;
    var p = pointerInStage(ev);
    var it = d.item;
    var dist = Math.hypot(p.x - it.x, p.y - it.y);
    d.ghost.remove();
    slots[it.key].classList.remove("hot");
    if (dist < 260) {                     // generous drop radius: playables forgive
      place(it);
    } else {
      d.trayEl.classList.remove("gone");  // put it back
      showHint();
    }
  }

  function place(it) {
    var wrap = el("div", "placed pop", room);
    wrap.style.width = it.w + "px";
    wrap.style.left = (it.x - it.w / 2) + "px";
    wrap.innerHTML = '<img src="' + A["v2_" + it.key] + '" alt="">';
    var img = wrap.querySelector("img");
    function anchor() {
      wrap.style.top = (it.y - wrap.offsetHeight) + "px";
      // a pet sitting on furniture rides just above it instead of by its own base line
      var base = it.onTop ? itemByKey(it.onTop).y + 6 : it.y;
      wrap.style.zIndex = depth(base) + (it.onTop ? 2 : 0);
    }
    if (img.complete) anchor(); else img.onload = anchor;

    slots[it.key].classList.add("done");
    sfx("place", 0.9, (it.key === "cat" || it.key === "dog") ? 1.18 : 1);
    sparkle(it.x, it.y - 40);
    [kid, document.getElementById("kid2")].forEach(function (k) {
      if (!k) return;
      k.classList.remove("happy"); void k.offsetWidth; k.classList.add("happy");
    });
    placedCount++;
    resetIdle();
    if (placedCount >= ITEMS.length) {
      setTimeout(function () { sfx("win", 0.95); confettiBurst(); }, 250);
      setTimeout(showEnd, 1400);
    } else {
      showHint();
    }
  }

  function itemByKey(k) {
    for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].key === k) return ITEMS[i];
    return null;
  }

  function sparkle(x, y) {
    for (var i = 0; i < 12; i++) {
      (function (k) {
        var s = el("div", "spark", stage);
        s.style.left = (x - 7) + "px";
        s.style.top = (y - 7) + "px";
        var ang = (k / 12) * Math.PI * 2, dist = 70 + Math.random() * 50;
        s.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) scale(0)", opacity: 0 }
        ], { duration: 560, easing: "cubic-bezier(.2,.7,.4,1)" });
        setTimeout(function(){ s.remove(); }, 580);
      })(i);
    }
  }

  /* ================= Hint: hand drags from tray to slot ================= */
  function nextPending() {
    for (var i = 0; i < ITEMS.length; i++) {
      if (!slots[ITEMS[i].key].classList.contains("done")) return ITEMS[i];
    }
    return null;
  }
  function stopHint() {
    if (hintTimer) { clearInterval(hintTimer); hintTimer = null; }
    hand.style.display = "none";
    Object.keys(trayItems).forEach(function (k) { trayItems[k].classList.remove("hint"); });
  }
  function showHint() {
    stopHint();
    var it = nextPending();
    if (!it || ended) return;
    var t = trayItems[it.key];
    t.classList.add("hint");
    var from = { x: t.offsetLeft + 24 + t.offsetWidth / 2, y: 1028 + t.offsetHeight / 2 };
    function run() {
      if (ended) { stopHint(); return; }
      hand.style.display = "block";
      hand.style.transition = "none";
      hand.style.left = from.x + "px";
      hand.style.top = from.y + "px";
      hand.className = ""; hand.id = "hand";
      hand.classList.add("tapanim");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          setTimeout(function () {
            hand.classList.remove("tapanim");
            hand.style.transition = "left .9s cubic-bezier(.4,0,.3,1), top .9s cubic-bezier(.4,0,.3,1)";
            hand.style.left = it.x + "px";
            hand.style.top = (it.y - 70) + "px";
          }, 420);
        });
      });
    }
    run();
    hintTimer = setInterval(run, 2300);
  }

  function firstTap() {
    taps++;
    resetIdle();
    if (taps === 1) {
      // AppLovin: the ad timer starts only after the first user interaction
      hardTimer = setTimeout(showEnd, HARD_TIMEOUT_MS);
    }
  }
  function resetIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(showEnd, IDLE_TIMEOUT_MS);
  }

  function confettiBurst() {
    var colors = ["#ad78ff", "#ffe07a", "#8fd0f5", "#f2a3c4", "#a4d43e", "#fff"];
    for (var i = 0; i < 64; i++) {
      (function () {
        var p = el("div", "confetti", stage);
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = (360 + (Math.random() - .5) * 280) + "px";
        p.style.top = "-30px";
        var dur = 1400 + Math.random() * 1200;
        p.animate([
          { transform: "rotate(0deg) translate(0,0)", opacity: 1 },
          { transform: "rotate(" + Math.random() * 720 + "deg) translate(" + ((Math.random() - .5) * 520) + "px,1360px)", opacity: .9 }
        ], { duration: dur, easing: "cubic-bezier(.2,.6,.6,1)" });
        setTimeout(function(){ p.remove(); }, dur);
      })();
    }
  }

  function showEnd() {
    if (ended) return;
    ended = true;
    if (idleTimer) clearTimeout(idleTimer);
    if (hardTimer) clearTimeout(hardTimer);
    stopHint();
    stopMusic();
    document.getElementById("top-bar").style.display = "none";
    document.getElementById("cta-wrap").style.display = "none";
    tray.style.display = "none";
    endcard.classList.add("show");
  }

  function startGame() {
    if (started) return;
    started = true;
    fit();
    decodeAll();
    buildRoom();
    buildTray();
    showHint();
  }

  onDomReady(function () {
    stage   = document.getElementById("stage");
    room    = document.getElementById("room");
    tray    = document.getElementById("tray");
    kid     = document.getElementById("kid");
    hand    = document.getElementById("hand");
    ctaPill = document.getElementById("cta-pill");
    endcard = document.getElementById("endcard");

    document.getElementById("room-bg").src = A.room2_top;
    document.getElementById("top-logo").src = A.logo_button;
    document.getElementById("brand-logo").src = A.logo_playgama;
    document.getElementById("e1").src = A.v2_kid1;
    document.getElementById("e2").src = A.v2_cat;
    document.getElementById("e3").src = A.v2_kid2;
    document.getElementById("e4").src = A.v2_dog;

    window.addEventListener("pointermove", onMove, { passive:true });
    window.addEventListener("pointerup", onRelease);
    window.addEventListener("pointercancel", onRelease);
    stage.addEventListener("pointerdown", function () { if (ended) openStore(); });
    ctaPill.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    document.getElementById("end-cta").addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    endcard.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });

    fit();
    whenViewable(startGame);
  });
})();
</script>
</body>
