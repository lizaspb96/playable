<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fruit Merge: Juicy Drop</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#f2e6cd; touch-action:none;
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  img { -webkit-user-drag:none; pointer-events:none; }
  #viewport { position:fixed; inset:0; overflow:hidden; background:#f2e6cd; }
  #stage { position:absolute; left:50%; top:50%; width:720px; height:1280px; transform-origin:center center; overflow:hidden;
    background:repeating-linear-gradient(90deg,#f9f1e0 0 80px,#f3e7cf 80px 160px); }
  /* 80px stripes tile 720px into 9 bands: an odd count, so the pattern is a
     palindrome and the left and right edges mirror each other exactly */

  #game { position:absolute; top:0; left:0; width:720px; height:1280px; z-index:2; }

  /* ---------- top bar ---------- */
  #top-bar { position:absolute; top:16px; left:0; width:100%; z-index:25;
    display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #top-logo { height:54px; width:auto; display:block; pointer-events:auto;
    filter:drop-shadow(0 5px 10px rgba(120,80,30,.35));
    animation:brandBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes brandBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.08) } }

  /* ---------- bottom CTA ---------- */
  #cta-wrap { position:absolute; bottom:16px; left:0; width:100%; z-index:25;
    display:flex; justify-content:center; pointer-events:none; }
  #cta-pill { position:static; background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff;
    font-size:34px; font-weight:800; padding:16px 60px; border-radius:60px;
    box-shadow:0 7px 0 #6a29c2, 0 12px 22px rgba(0,0,0,.28);
    cursor:pointer; letter-spacing:.5px; white-space:nowrap; pointer-events:auto;
    animation:ctaBreathe 1.4s ease-in-out infinite; will-change:transform; }
  @keyframes ctaBreathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.07) } }

  /* ---------- straight evolution arrow, fills the gap above the CTA ---------- */
  #evo { position:absolute; bottom:116px; left:50%; transform:translateX(-50%);
    width:672px; height:84px; z-index:20; pointer-events:none; }
  #evo svg.shape { position:absolute; inset:0; width:100%; height:100%; }
  #evo .row { position:absolute; left:16px; top:0; width:552px; height:100%;
    display:flex; align-items:center; justify-content:space-between; }
  #evo .row img { height:55px; width:auto; display:block;
    filter:drop-shadow(0 2px 3px rgba(120,80,20,.35)); }

  #hand { position:absolute; width:110px; height:110px; z-index:30; pointer-events:none; font-size:96px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); animation:handTap 1.1s ease-in-out infinite;
    transform-origin:20% 15%; transition:left .3s ease, top .3s ease; }
  @keyframes handTap { 0%,100%{transform:scale(1) rotate(-12deg)} 50%{transform:scale(.82) rotate(-4deg)} }

  .popup-score { position:absolute; z-index:22; font-size:44px; font-weight:800; color:#fff;
    text-shadow:0 3px 0 #d9862a; pointer-events:none; animation:popScore .8s ease-out forwards; }
  @keyframes popScore { 0%{transform:scale(.4) translateY(0); opacity:1} 100%{transform:scale(1.3) translateY(-70px); opacity:0} }

  /* ---------- End card ---------- */
  #endcard { position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(120,80,30,.5); backdrop-filter:blur(3px); }
  #endcard.show { display:flex; }
  #endbox { width:664px; background:linear-gradient(180deg,#fffdf6,#fdf3dd); border-radius:52px; padding:36px 44px 48px;
    text-align:center; box-shadow:0 22px 54px rgba(0,0,0,.45); animation:endIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes endIn { from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
  #endbox .cast { height:200px; display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-bottom:10px; }
  #endbox .cast img { filter:drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  #endbox .cast img.big { height:176px; }
  #endbox .cast img.mid { height:128px; }
  #endbox .cast img.sml { height:96px; }
  #endbox h1 { font-size:56px; color:#e0932e; font-weight:800; text-shadow:0 2px 0 #fff; }
  #endbox p { font-size:34px; color:#8a6c42; font-weight:700; margin:12px 0 30px; }
  #end-cta { display:inline-block; background:linear-gradient(180deg,#ad78ff,#9747ff); color:#fff; font-size:50px;
    font-weight:800; padding:26px 92px; border-radius:70px; box-shadow:0 8px 0 #6a29c2, 0 12px 20px rgba(0,0,0,.25);
    cursor:pointer; animation:ctaBreathe2 1.3s ease-in-out infinite; }
  @keyframes ctaBreathe2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  #endbox .brand { margin-top:26px; font-size:30px; font-weight:700; color:#b59a72;
    display:flex; align-items:center; justify-content:center; gap:12px; }
  #endbox .brand img { height:40px; width:auto; display:block; }

  .confetti { position:absolute; width:16px; height:16px; z-index:35; border-radius:3px; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    #cta-pill, #end-cta, #hand, #top-logo { animation:none !important; }
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <canvas id="game" width="720" height="1280"></canvas>

    <div id="top-bar"><img id="top-logo" alt="Playgama"></div>
    <div id="cta-wrap"><div id="cta-pill">PLAY NOW</div></div>

    <div id="evo">
      <svg class="shape" viewBox="0 0 700 88" preserveAspectRatio="none">
        <path d="M44 6 H592 V0 L697 44 L592 88 V82 H44 A38 38 0 0 1 44 6 Z"
              fill="#ffe14d" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
      </svg>
      <div class="row" id="evo-row"></div>
    </div>

    <div id="hand">&#128070;</div>

    <div id="endcard">
      <div id="endbox">
        <div class="cast">
          <img id="c1" class="sml" alt=""><img id="c2" class="mid" alt=""><img id="c3" class="big" alt=""><img id="c4" class="mid" alt="">
        </div>
        <h1>Juicy!</h1>
        <p>Fruit Merge: Juicy Drop</p>
        <div id="end-cta">PLAY NOW</div>
        <div class="brand">Play for free on <img id="brand-logo" alt="Playgama"></div>
      </div>
    </div>

  </div>
</div>

  /* ================= MRAID bootstrap (v2, wait for ready) ================= */
  function whenViewable(cb) {
    if (typeof mraid === "undefined") { onDomReady(cb); return; }
    function start() {
      if (mraid.isViewable()) { cb(); }
      else {
        mraid.addEventListener("viewableChange", function h(v) {
          if (v) { mraid.removeEventListener("viewableChange", h); cb(); }
        });
      }
    }
    if (mraid.getState() === "loading") {
      mraid.addEventListener("ready", function r() {
        mraid.removeEventListener("ready", r); start();
      });
    } else { start(); }
  }
  function onDomReady(cb) {
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", cb);
    else cb();
  }
  function openStore() {
    try {
      if (typeof mraid !== "undefined" && mraid.open) { mraid.open(CLICK_URL); return; }
    } catch (e) {}
    window.location.href = CLICK_URL;
  }

  /* ================= Stage scaling (portrait + landscape) ================= */
  var STAGE_W = 720, STAGE_H = 1280;
  function fit() {
    var vw = (window.visualViewport && window.visualViewport.width)  || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var s = Math.min(vw / STAGE_W, vh / STAGE_H);
    document.getElementById("stage").style.transform =
      "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  [80, 250, 600, 1200].forEach(function (ms) { setTimeout(fit, ms); });


  /* ================= Audio: music from the game, SFX synthesised =================
     AppLovin: nothing plays before the first interaction, and everything stops
     when the ad is hidden or closed. */
  var AC = null, musicOn = false, musicSrc = null, musicGain = null;
  var musicBuf = null, sfxBufs = {};

  function audioCtx() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    return AC;
  }
  function b64ToBuf(dataUri) {
    var bin = atob(dataUri.split(",")[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function decodeAll() {
    var ctx = audioCtx();
    if (!ctx) return;
    function dec(uri, cb) {
      try {
        var pr = ctx.decodeAudioData(b64ToBuf(uri), cb, function () {});
        if (pr && pr.then) pr.then(cb, function () {});
      } catch (e) {}
    }
    dec(SND.music, function (b) { musicBuf = b; if (musicOn && !musicSrc) playMusic(); });
    ["merge", "drop", "win"].forEach(function (k) {
      dec(SND[k], function (b) { sfxBufs[k] = b; });
    });
  }
  function playMusic() {
    var ctx = audioCtx();
    if (!ctx || !musicBuf || musicSrc) return;
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.32;
    musicGain.connect(ctx.destination);
    musicSrc = ctx.createBufferSource();
    musicSrc.buffer = musicBuf;
    musicSrc.loop = true;
    musicSrc.connect(musicGain);
    musicSrc.start(0);
  }
  function startMusic() {
    var ctx = audioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (musicOn) return;
    musicOn = true;
    playMusic();
  }
  function stopMusic() {
    musicOn = false;
    if (musicSrc) { try { musicSrc.stop(); } catch (e) {} try { musicSrc.disconnect(); } catch (e) {} musicSrc = null; }
    if (musicGain) { try { musicGain.disconnect(); } catch (e) {} musicGain = null; }
    if (AC && AC.state === "running") { try { AC.suspend(); } catch (e) {} }
  }
  function resumeMusicIfStarted() {
    if (taps > 0 && !ended) {
      if (AC && AC.state === "suspended") AC.resume();
      if (!musicOn) { musicOn = true; playMusic(); }
    }
  }
  // rate lets one "blup" cover the whole chain: bigger fruit = deeper pop
  function sfx(name, vol, rate) {
    var ctx = audioCtx();
    if (!ctx || ctx.state !== "running" || !sfxBufs[name]) return;
    var g = ctx.createGain();
    g.gain.value = vol || 0.85;
    g.connect(ctx.destination);
    var sN = ctx.createBufferSource();
    sN.buffer = sfxBufs[name];
    if (rate) sN.playbackRate.value = rate;
    sN.connect(g);
    sN.start(0);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopMusic(); else resumeMusicIfStarted();
  });
  if (typeof mraid !== "undefined") {
    try {
      mraid.addEventListener("viewableChange", function (v) {
        if (!v) stopMusic(); else resumeMusicIfStarted();
      });
    } catch (e) {}
  }

  /* ================= Fruit chain ================= */
  var FRUITS = [
    { key:"cherry",     r:30 },
    { key:"blueberry",  r:37 },
    { key:"lime",       r:45 },
    { key:"grape",      r:55 },
    { key:"orange",     r:66 },
    { key:"apple",      r:79 },
    { key:"peach",      r:93 }
  ];
  var SCORE_PER_MERGE = [2, 4, 8, 14, 22, 32, 46];
  var IMGS = {};
  function preload() {
    FRUITS.forEach(function (f) {
      var im = new Image();
      im.src = A["fr_" + f.key];
      IMGS[f.key] = im;
    });
  }

  /* ================= Board geometry ================= */
  var CW = 720, CH = 1280;
  var BOX = { left:96, right:624, top:236, bottom:1006 };
  var GRAVITY = 2600, REST = 0.12, FRICTION = 0.985;

  /* ================= State ================= */
  var stage, canvas, ctx, hand, ctaPill, endcard;
  var started = false, ended = false, taps = 0, drops = 0, merges = 0, score = 0;
  var idleTimer = null, hardTimer = null;
  var bodies = [], dropX = 360, canDrop = true;
  var queue = [4, 2, 4, 0, 3, 1, 4, 2, 0, 3, 1, 4];
  var qi = 0, effects = [];

  function currentType() { return queue[qi % queue.length]; }

  /* ================= Drawing ================= */
  function drawBoard() {
    ctx.fillStyle = "#ded2b2";
    ctx.fillRect(BOX.left - 16, BOX.top - 44, BOX.right - BOX.left + 32, BOX.bottom - BOX.top + 60);
    ctx.fillStyle = "#d3c6a4";
    ctx.fillRect(BOX.left, BOX.top - 28, BOX.right - BOX.left, BOX.bottom - BOX.top + 28);
    ctx.fillStyle = "#e8dcbe";
    ctx.beginPath();
    ctx.moveTo(BOX.left - 16, BOX.top - 44); ctx.lineTo(BOX.left, BOX.top - 28);
    ctx.lineTo(BOX.right, BOX.top - 28); ctx.lineTo(BOX.right + 16, BOX.top - 44);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#efc379";
    ctx.fillRect(0, BOX.bottom + 16, CW, CH - BOX.bottom - 16);
    if (!ended && canDrop) {
      ctx.setLineDash([16, 18]);
      ctx.strokeStyle = "rgba(255,252,240,.9)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(dropX, BOX.top - 10);
      ctx.lineTo(dropX, BOX.bottom - 4);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawFruit(b) {
    var f = FRUITS[b.t];
    var im = IMGS[f.key];
    var r = b.r * b.scale;
    if (!im || !im.complete || !im.naturalWidth) {   // sprite not decoded yet
      ctx.fillStyle = "#e8c07a";
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.rot) ctx.rotate(b.rot);
    ctx.drawImage(im, -r, -r, r * 2, r * 2);
    ctx.restore();
  }

  function drawDropper() {
    if (ended || !canDrop) return;
    var t = currentType();
    drawFruit({ x:dropX, y:BOX.top - 66, t:t, r:FRUITS[t].r, scale:1, rot:0 });
  }

  function drawEffects(dt) {
    for (var i = effects.length - 1; i >= 0; i--) {
      var fx = effects[i];
      fx.age += dt;
      var k = fx.age / .45;
      if (k >= 1) { effects.splice(i, 1); continue; }
      ctx.strokeStyle = fx.color;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 8 * (1 - k);
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.r * (0.6 + k * 1.1), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ================= Physics ================= */
  function stepPhysics(dt) {
    var i, j, b;
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      if (b.scale < 1) b.scale = Math.min(1, b.scale + dt * 4);
      b.vy += GRAVITY * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= FRICTION;
      b.rot += b.vx * dt * 0.004;
      if (b.x - b.r < BOX.left)  { b.x = BOX.left + b.r;  b.vx = Math.abs(b.vx) * REST; }
      if (b.x + b.r > BOX.right) { b.x = BOX.right - b.r; b.vx = -Math.abs(b.vx) * REST; }
      if (b.y + b.r > BOX.bottom) { b.y = BOX.bottom - b.r; b.vy = -Math.abs(b.vy) * REST; if (Math.abs(b.vy) < 40) b.vy = 0; }
    }
    for (i = 0; i < bodies.length; i++) {
      for (j = i + 1; j < bodies.length; j++) {
        var a = bodies[i], c = bodies[j];
        if (a.dead || c.dead) continue;
        var dx = c.x - a.x, dy = c.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || .001;
        var minD = a.r + c.r;
        if (dist < minD) {
          if (a.t === c.t && a.t < FRUITS.length - 1 && a.scale === 1 && c.scale === 1) {
            mergePair(a, c);
            continue;
          }
          var overlap = (minD - dist) / 2;
          var ux = dx / dist, uy = dy / dist;
          a.x -= ux * overlap; a.y -= uy * overlap;
          c.x += ux * overlap; c.y += uy * overlap;
          var rel = (c.vx - a.vx) * ux + (c.vy - a.vy) * uy;
          if (rel < 0) {
            var imp = -rel * (1 + REST) / 2;
            a.vx -= ux * imp; a.vy -= uy * imp;
            c.vx += ux * imp; c.vy += uy * imp;
          }
        }
      }
    }
    for (i = bodies.length - 1; i >= 0; i--) if (bodies[i].dead) bodies.splice(i, 1);
  }

  function mergePair(a, c) {
    a.dead = c.dead = true;
    var nt = a.t + 1;
    var nx = (a.x + c.x) / 2, ny = (a.y + c.y) / 2;
    ny = Math.min(ny, BOX.bottom - FRUITS[nt].r);
    bodies.push({ x:nx, y:ny, vx:0, vy:-160, t:nt, r:FRUITS[nt].r, scale:.55, rot:0, dead:false });
    effects.push({ x:nx, y:ny, age:0, r:FRUITS[nt].r, color:"#ffd23e" });
    sfx("merge", 0.9, Math.max(0.62, 1.18 - nt * 0.08));
    merges++;
    score += SCORE_PER_MERGE[nt];
    popScoreAt(nx, ny, "+" + SCORE_PER_MERGE[nt]);
    if (merges >= WIN_MERGES) setTimeout(win, 900);
  }

  function popScoreAt(cx, cy, text) {
    var el = document.createElement("div");
    el.className = "popup-score";
    el.textContent = text;
    el.style.left = (cx - 40) + "px";
    el.style.top = (cy - 30) + "px";
    stage.appendChild(el);
    setTimeout(function(){ el.remove(); }, 850);
  }

  /* ================= Input ================= */
  function canvasX(ev) {
    var rect = canvas.getBoundingClientRect();
    var x = (ev.clientX - rect.left) / rect.width * CW;
    var r = FRUITS[currentType()].r;
    return Math.max(BOX.left + r + 2, Math.min(BOX.right - r - 2, x));
  }
  function onPointerDown(ev) {
    if (ended) { openStore(); return; }
    dropX = canvasX(ev);
    tryDrop();
  }
  function onPointerMove(ev) {
    if (ended) return;
    if (ev.pressure > 0 || ev.pointerType === "mouse") dropX = canvasX(ev);
  }

  function tryDrop() {
    if (!canDrop || ended) return;
    taps++;
    resetIdle();
    if (taps === 1) {
      // AppLovin: the ad timer and all audio start only after the first interaction
      hand.style.display = "none";
      hardTimer = setTimeout(showEnd, HARD_TIMEOUT_MS);
    }
    startMusic();
    sfx("drop", 0.7);
    var t = currentType();
    bodies.push({ x:dropX, y:BOX.top - 66, vx:0, vy:120, t:t, r:FRUITS[t].r, scale:1, rot:0, dead:false });
    qi++; drops++;
    canDrop = false;
    setTimeout(function(){ canDrop = true; }, 480);
    if (drops >= MAX_DROPS) setTimeout(showEnd, 2200);
  }

  function resetIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(showEnd, IDLE_TIMEOUT_MS);
  }

  /* ================= Finish ================= */
  function confettiBurst() {
    var colors = ["#f06aa8", "#4d9fe0", "#8fc94e", "#f5a45f", "#b33434", "#ffd23e"];
    for (var i = 0; i < 60; i++) {
      (function () {
        var p = document.createElement("div");
        p.className = "confetti";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = (360 + (Math.random() - .5) * 260) + "px";
        p.style.top = "-30px";
        stage.appendChild(p);
        var dur = 1400 + Math.random() * 1200;
        p.animate([
          { transform: "rotate(0deg) translate(0,0)", opacity: 1 },
          { transform: "rotate(" + Math.random() * 720 + "deg) translate(" + ((Math.random() - .5) * 500) + "px,1360px)", opacity: .9 }
        ], { duration: dur, easing: "cubic-bezier(.2,.6,.6,1)" });
        setTimeout(function(){ p.remove(); }, dur);
      })();
    }
  }
  function win() { if (ended) return; sfx("win", 0.95); confettiBurst(); setTimeout(showEnd, 900); }

  function showEnd() {
    if (ended) return;
    ended = true;
    if (idleTimer) clearTimeout(idleTimer);
    if (hardTimer) clearTimeout(hardTimer);
    hand.style.display = "none";
    document.getElementById("top-bar").style.display = "none";
    document.getElementById("cta-wrap").style.display = "none";
    document.getElementById("evo").style.display = "none";
    stopMusic();
    endcard.classList.add("show");
  }

  /* ================= Loop ================= */
  var lastTs = null;
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, .033);
    lastTs = ts;
    stepPhysics(dt);
    ctx.clearRect(0, 0, CW, CH);
    drawBoard();
    for (var i = 0; i < bodies.length; i++) drawFruit(bodies[i]);
    drawDropper();
    drawEffects(dt);
    requestAnimationFrame(frame);
  }

  function startGame() {
    if (started) return;
    started = true;
    fit();
    // a few fruits already in the box so the first tap can merge straight away
    bodies.push({ x:210, y:BOX.bottom - FRUITS[4].r, vx:0, vy:0, t:4, r:FRUITS[4].r, scale:1, rot:0, dead:false });
    bodies.push({ x:430, y:BOX.bottom - FRUITS[4].r, vx:0, vy:0, t:4, r:FRUITS[4].r, scale:1, rot:0, dead:false });
    bodies.push({ x:556, y:BOX.bottom - FRUITS[1].r, vx:0, vy:0, t:1, r:FRUITS[1].r, scale:1, rot:0, dead:false });
    bodies.push({ x:318, y:BOX.bottom - FRUITS[0].r, vx:0, vy:0, t:0, r:FRUITS[0].r, scale:1, rot:0, dead:false });
    dropX = 320;
    hand.style.left = "290px";
    hand.style.top = "620px";
    requestAnimationFrame(frame);
  }

  onDomReady(function () {
    stage   = document.getElementById("stage");
    canvas  = document.getElementById("game");
    ctx     = canvas.getContext("2d");
    hand    = document.getElementById("hand");
    ctaPill = document.getElementById("cta-pill");
    endcard = document.getElementById("endcard");

    preload();
    decodeAll();
    document.getElementById("top-logo").src = A.logo_button;
    document.getElementById("brand-logo").src = A.logo_playgama;
    document.getElementById("c1").src = A.fr_cherry;
    document.getElementById("c2").src = A.fr_orange;
    document.getElementById("c3").src = A.fr_watermelon;
    document.getElementById("c4").src = A.fr_peach;

    var EVO = ["cherry","blueberry","lime","grape","orange","apple",
               "peach","coconut","dragon","pineapple","watermelon"];
    document.getElementById("evo-row").innerHTML =
      EVO.map(function (k) { return '<img src="' + A["fr_" + k] + '" alt="">'; }).join("");

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    ctaPill.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    document.getElementById("end-cta").addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });
    endcard.addEventListener("pointerdown", function (e) { e.stopPropagation(); openStore(); });

    fit();
    whenViewable(startGame);
  });
})();
</script>
</body>
</html>
